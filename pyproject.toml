[project]
name = "tg-translator"
version = "0.1.0"
description = "Telegram channel message translator"
requires-python = ">=3.10"
dependencies = [
    # Kurigram is the maintained drop-in replacement for the abandoned Pyrogram
    # (still imported as `pyrogram`). The code uses Pyrogram, never Telethon.
    "kurigram==2.2.26",
    # 22.8 is the newest release; it targets Bot API 10.0. That lag doesn't
    # matter here — PTB is only a Bot-API RPC client for get_chat/get_file.
    "python-telegram-bot[rate-limiter]==22.8",
    # anthropic 1.x moved its internal HTTP layer to `httpx2`, which installs
    # alongside the `httpx` pinned below (separate distribution, no conflict).
    # 1.x also dropped temperature/top_p/top_k from messages.create() — see
    # translation_utils.translate_html, which passes temperature via extra_body.
    "anthropic==1.6.0",
    "httpx==0.28.1",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    # nh3 replaces bleach, which is end-of-life (final release 6.4.0; repo
    # archived/read-only 2026-06-10, no further security fixes). nh3 is the
    # maintained, Rust-backed (ammonia) HTML sanitizer.
    "nh3>=0.3.7",
    "flask==3.1.3",
    "flask-login==0.6.3",
    # CSRF protection for the admin POST forms.
    "flask-wtf>=1.3.0",
    # Explicit security floors for Flask's transitive deps so a constrained or
    # cached resolver can't pull a vulnerable build:
    #   werkzeug 3.1.8 -> CVE-2026-21860 (Windows safe_join path traversal)
    #   jinja2   3.1.6 -> CVE-2025-27516 (sandbox escape)
    "werkzeug>=3.1.8",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2",
]

# PEP 735 dependency group. `uv sync` installs it by default (local dev);
# `uv sync --no-dev` is what the server runs, so test tooling never lands in
# production.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    # pytest-asyncio 1.3.0 added pytest 9 support; required by the pytest pin.
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
# This repo is run from a checkout with the repo root on PYTHONPATH — neither
# `translator` nor `app` was ever installed as a distribution, and setuptools
# has no package config here to do it with. `package = false` tells uv to manage
# only the dependencies and never try to build/install the project itself.
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
